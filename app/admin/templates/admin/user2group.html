{% extends "base.html" %}

{% block content %}
    <!-- h1>Enter Channel Number to set Full or Out</h1 -->

{% include 'admin/admin_menu.html' %}

{% if base %}

<style>
  #matrix-table .tabulator-cell {
    padding: 4px;
}

</style>

<script>
    base_page = "{{ base }}";
    document.getElementsByClassName(base_page)[0].classList.add("selected-button", "w3-green");
    document.getElementsByClassName(base_page)[0].classList.remove("w3-dark-gray");
</script>
{% endif %}

<!-- Page Content -->
<div class="w3-main" style="margin-left:200px">
  <button class="w3-button w3-xlarge w3-hide-large" onclick="w3_open()">&#9776;</button>
  <div class="w3-container">
    <h1>Add Users To Groups</h1>
    <div class="w3-row">
      <div class="w3-col m6 l4">&nbsp;</div>
    </div>
    <div id="matrix-table"></div>
    
  </div>
</div>

<script>

  async function buildMatrix() {
    const res = await fetch("/admin/api/permissions_matrix");
    const data = await res.json();
    

    const baseCols = [
        { title: "User", field: "username", frozen: true }
    ];

    const groupCols = data.groups.map(g => ({
        title: g.name,
        field: `g_${g.index_id}`,
        hozAlign: "center",
        formatter: "tickCross",
        formatterParams: {
         allowTruthy: true,
         tickElement:"<i class='fa fa-check' style='color: green;'></i>",
         crossElement:"<i class='fa fa-times' style='color: red;'></i>",
        },
        cellClick: onToggleClick
    }));

    const table = new Tabulator("#matrix-table", {
        layout: "fitDataTable",
        data: data.rows,
        columns: [...baseCols, ...groupCols]
    });

    window.matrixTable = table; // optional global
  }

  buildMatrix();

  const currentUserId = {{ current_user.id|tojson }}

  //Keeping this one local rather than the generic one in script.js
  //as this behaves differently than the typical create/update

  async function onToggleClick(e, cell) {
    const row = cell.getRow().getData();
    const field = cell.getField();
    const groupId = field.split("_")[1];
    const userId = row.user_id;
    const groupTitle  = cell.getColumn().getDefinition().title

   //Current user cannot add/remove admin access for themselves
    
    if (userId == currentUserId && groupTitle == 'admin') {
      alert("You cannot add/remove yourself to the admin group.  Another admin will need to do this.");
      return
    }

    const currentValue = cell.getValue();
    const newValue = !currentValue;

    // update UI immediately
    cell.setValue(newValue);
    

    try {
        const res = await fetch("/admin/api/update_user_group", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                user_id: userId,
                group_id: groupId,
                assigned: newValue
            })
        });

        if (!res.ok) throw new Error();

        // success flash
        cell.getElement().classList.add("w3-pale-green");
        setTimeout(() => cell.getElement().classList.remove("w3-pale-green"), 2000);

    } catch (err) {
        // revert on failure
        cell.setValue(currentValue);
        cell.getElement().classList.add("w3-pale-red");
    }
  }
  
</script>

<script src="{{ url_for('admin.static', filename='js/admin.js') }}?v={{ version }}"></script>

{% endblock %}
