{% extends "base.html" %}

{% block content %}
    <!-- h1>Enter Channel Number to set Full or Out</h1 -->

{% include 'tech_director/tech_director_menu.html' %}

<!-- Page Content -->
<div class="w3-main" style="margin-left:200px">
  <button class="w3-button w3-xlarge w3-hide-large" onclick="w3_open()">&#9776;</button>
  <div class="w3-container">
    <h1>
      <span id='label-active' style="display:inline-block">Active</span>
      <span id='label-all' style="display:none">All</span>
      Inventory Assignments
    </h1>
    {{ form.see_all_records() }}
    {{ form.see_active_records() }}
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
    <div class="pageErrorField w3-text-red"></div>
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
    <div id="members-table"></div>
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
  </div>
</div>


<script>

  document.addEventListener("DOMContentLoaded", async () => {
    const { namesById, nameOptions } = await getStudentNames();
    await InitializePageTable(namesById, nameOptions);
  });

  const tableBaseUrl = '/tech_director/api/list_inventory_assignments';
  const tableData = `${tableBaseUrl}/active`

  const assignment_group = "{{ assignment_group }}"

  const pageErrorField = document.querySelector(".pageErrorField")

  const allButton = document.getElementById("see_all_records");
  const activeButton = document.getElementById("see_active_records");

  const createEndpoint = '/tech_director/api/assign_student_inventory'

  const updateTargets = {
    membership: {
      endpoint: `/tech_director/api/update_membership_info/${assignment_group}`,
      idField: "index_id",
    }
  };

  const fieldEntities = {
    student_id: 'membership',
    assign_date: 'membership',
    due_date: 'membership',
    status_id: 'membership',
  };

  let pageTable = []

  function InitializePageTable  (studentNames, studentOptions) {
    const initialSort = [
      { column: "name", dir: "asc" },
    ];
    pageTable = new Tabulator("#members-table", {
      ajaxURL: tableData,
      dataLoader: false,
      layout:"fitDataTable",
      index:"index_id",
      tabEndNewRow: true,
      sortOrderReverse: true,
      initialSort: initialSort,
      columns:[ //Define Table Columns
        {
          title:"Item Name",
          field:"name",
          headerFilter:"input",
          editable:false
        },
        {
          title:"Student", 
          field:"student_id",
          formatter: (cell) => studentNames[String(cell.getValue())] ?? "",
          headerFilter: "input",
          headerFilterFunc: function (headerValue, rowValue) {
            const displayedName = studentNames[String(rowValue)] ?? "";
            return displayedName
              .toLowerCase()
              .includes(headerValue.toLowerCase());
          },
          editor: "list", // Inline select menu
          editorParams:{
            values: studentOptions, // Grabs the loaded team array
            autocomplete: true,
            listOnEmpty: true,
            clearable: true,
          },
        },
        {
          title:"Check Out Date", 
          field:"assign_date", 
          formatter:"datetime", formatterParams:{
            inputFormat:"yyyy-MM-dd",
            outputFormat:"yyyy-MM-dd",
            invalidPlaceholder:"(invalid date)",
            timezone:"America/Los_Angeles",
          },
          editor: "date",
        },
        {
          title:"Due Date", 
          field:"due_date",
          formatter:"datetime", formatterParams:{
            inputFormat:"yyyy-MM-dd",
            outputFormat:"yyyy-MM-dd",
            invalidPlaceholder:"(invalid date)",
            timezone:"America/Los_Angeles",
          },
          editor: "date",
        },
        {
          title:"Returned Date", 
          field:"returned_date",
          formatter:"datetime", formatterParams:{
            inputFormat:"yyyy-MM-dd",
            outputFormat:"yyyy-MM-dd",
            invalidPlaceholder:"(invalid date)",
            timezone:"America/Los_Angeles",
          },
          editor: "date",
        },
        {
          title:"Checked Out",
          field:"status_id",
          hozAlign:"center", 
          formatter:"tickCross",
          formatterParams: {
          allowTruthy: true,
          tickElement:"<i class='fa fa-check'></i>",
          crossElement:"<i class='fa fa-times'></i>",
          },
          cellClick: function (e, cell) {
            cell.setValue(!cell.getValue());
          },
        },
      ],
    });

    PageSetup.setupManageRecordChanges({
        table: pageTable,
        addButton: null,
        cancelButton: null,
        errorField: pageErrorField,
        createEndpoint,
        updateTargets,
        fieldEntities,
        requiredFields: ["student_id", "inventory_id"],
        excludedFields: [],
        nullableFields: ["assign_date", "due_date"]
      });

      PageSetup.activeAllSelection({
        allButton: allButton,
        activeButton: activeButton,
        pageTable,
        tableBaseUrl
    })
  }

async function getStudentNames() {
  const rows = await TabulatorActions.getData(
    "/tech_director/api/list_student_names"
  );

  const namesById = Object.fromEntries(
    rows.map((student) => [
      String(student.index_id),
      student.full_name
    ])
  );

  let nameOptions = rows.map((student) => ({
    label: student.full_name,
    value: String(student.index_id)
  }));


  return { namesById, nameOptions };
}

</script>

<script src="{{ url_for('tech_director.static', filename='js/tech_director.js') }}?v={{ version }}"></script>



{% endblock %}
