{% extends "base.html" %}

{% block content %}
    <!-- h1>Enter Channel Number to set Full or Out</h1 -->

{% include 'tech_director/tech_director_menu.html' %}

<!-- Page Content -->
<div class="w3-main" style="margin-left:200px">
  <button class="w3-button w3-xlarge w3-hide-large" onclick="w3_open()">&#9776;</button>
  <div class="w3-container">
    <h1>Manage 
      <span id='label-active' style="display:inline-block">Active</span>
      <span id='label-all' style="display:none">All</span>
      Students
    </h1>
    {{ form.see_all_records() }}
    {{ form.see_active_records() }}
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
    {{ form.add_student() }}
    {{ form.cancel_add() }}
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
    <div class="pageErrorField w3-text-red"></div>
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
    <div id="student-table"></div>
    
  </div>
</div>

<script>

  const cancelAddButton = document.getElementById("cancel_add");
  const addRecordButton = document.getElementById("add_student");
  const pageErrorField = document.querySelector(".pageErrorField")

  const allButton = document.getElementById("see_all_records");
  const activeButton = document.getElementById("see_active_records");
  
  const tableBaseUrl = '/tech_director/api/list_students';
  const tableData = `${tableBaseUrl}/active`
  
  const requiredFields = ["email"];
  const excludedFields = ["ID", "class"];

  const updateTarget = {
    endpoint: "/tech_director/api/update_student",
    idField: "index_id",
  };

  const pageTable = new Tabulator("#student-table", {
    ajaxURL: tableData,
    dataLoader: false,
    layout:"fitDataTable", //fit columns to width of table (optional)
    index:"index_id",
    tabEndNewRow: true,
    sortOrderReverse: true,
    initialSort: [
      {column: "graduation_year", dir: "asc"},
      {column: "first_name", dir: "asc" } // Then sort by this second
    ],
    columns:[ //Define Table Columns
      {title:"Email", field:"email", editor:"input"},
      {
        title:"First Name",
        field:"first_name",
        editor:"input",
        headerFilter:"input"
      },
      {
        title:"Last Name",
        field:"last_name",
        editor:"input",
        headerFilter:"input"
      },       
      {title: "Graduation Year", 
      field: "graduation_year", 
      editor: "number", // Changed from "input"
      editorParams: {
        min: 2025,
        max: 2100,
        step: 1
      },
      mutateLink: "class", 
      validator: function(cell, value, parameters){
        var yearNum = parseInt(value, 10);
        return !isNaN(yearNum) && yearNum >= 2025 && yearNum <= 2100;
      }
      },
      {
        title:"Class", 
        field:"class",
        editor: false,
        editable: false,
        mutator: function(value, data) {
          // data contains all values from the AJAX response for this row
          return getHighSchoolClass(data.graduation_year);
        }
      },
      {title:"Notes", field:"notes", editor:"input"},
      {
        title:"Active",
        field:"status_id",
        hozAlign:"center", 
        formatter:"tickCross",
        formatterParams: {
         allowTruthy: true,
         tickElement:"<i class='fa fa-check'></i>",
         crossElement:"<i class='fa fa-times'></i>",
        },
        cellClick: function (e, cell) {
          cell.setValue(!cell.getValue());
        },
      },
      {title:"Parents' Name(s)", field:"parentName", editor:"input"},
      {title:"Parent's Email", field:"parentEmail", editor:"input"},
    ],
    });

    PageSetup.setupManageRecordChanges({
      table: pageTable,
      addButton: addRecordButton,
      cancelButton: cancelAddButton,
      errorField: pageErrorField,
      createEndpoint: "/tech_director/api/add_student",
      updateTarget,
      requiredFields,
      excludedFields
    });

    PageSetup.activeAllSelection({
        allButton: allButton,
        activeButton: activeButton,
        pageTable,
        tableBaseUrl
    })

</script>

<script src="{{ url_for('dm7.static', filename='js/dm7.js') }}?v={{ version }}"></script>



{% endblock %}
