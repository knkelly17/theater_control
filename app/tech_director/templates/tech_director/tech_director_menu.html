{% include 'user_menu.html' %} 

<!-- Sidebar -->

<style>
  #tech_directorSidebar .w3-dropdown-content {
    position: static;
  }

  #tech_directorSidebar .w3-dropdown-click {
    display: block;
    float: none;
  }

  #tech_directorSidebar .w3-dropdown-content .w3-bar-item {
    padding-left: 16px;
  }

</style>

{% if base %}
<script>
    base_page = "{{ base }}";
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementsByClassName(base_page)[0].classList.add("selected-button", "w3-green");
        document.getElementsByClassName(base_page)[0].classList.remove("w3-dark-gray");
    })
</script>
{% endif %}

{% if sub_base %}
<script>
    sub_base_page = "{{ sub_base }}";
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementsByClassName(sub_base_page)[0].classList.add("w3-lime");
    })
</script>
{% endif %}


<div id="ajax-loader" class="w3-modal" style="display:none; z-index:9999;">
  <div class="w3-display-middle w3-center">
    <i class="w3-jumbo w3-spin w3-text-white fa fa-spinner"></i>
    <h3 class="w3-text-white">Loading, please wait...</h3>
  </div>
</div>


<div class="w3-sidebar w3-bar-block w3-collapse w3-card" style="width:200px;" id="tech_directorSidebar">
    <button class="w3-bar-item w3-button w3-hide-large" onclick="w3_close()">Close &times;</button>
    
    <div class="w3-container w3-light-gray w3-center">
        <div class="w3-bar-block">

            <a href="{{ url_for('tech_director.students') }}"
                class="w3-button w3-bar-item 
                    w3-dark-gray tech_director students">Students</a>
                    
            <!-- a href="{{ url_for('tech_director.av_club_members') }}"
                class="w3-button w3-bar-item 
                    w3-left w3-dark-gray tech_director av_club_members">AV Club</a-->

            <div class="w3-dropdown-click">
                <button 
                    type="button"
                    class="w3-button w3-dark-gray tech_director av_club_members"
                    data-menu-toggle
                    aria-expanded="{{ 'true' if base == 'av_club_members' else 'false' }}">
                    AV Club<i class="fa fa-caret-down"></i></button>
                <div class="w3-dropdown-content w3-bar-block
                  {% if base == 'av_club_members' %}w3-show{% endif %}">
                    <a href="{{ url_for('tech_director.av_club_members') }}" 
                       class="w3-button w3-bar-item 
                       tech_director assign_student"><i class='fa fa-caret-right'></i>Assign Student</a>
                </div>
            </div>
    
            <div class="w3-dropdown-click">
                <button 
                    type="button"
                    class="w3-button w3-dark-gray tech_director shows"
                    data-menu-toggle
                    aria-expanded="{{ 'true' if base == 'shows' else 'false' }}">
                    Shows/Events<i class="fa fa-caret-down"></i></button>
                <div class="w3-dropdown-content w3-bar-block
                  {% if base == 'shows' %}w3-show{% endif %}">
                    <a href="{{ url_for('tech_director.shows') }}" 
                       class="w3-button w3-bar-item 
                       tech_director list_show"><i class='fa fa-caret-right'></i>List</a>
                    <a href="{{ url_for('tech_director.students_shows') }}" 
                       class="w3-button w3-bar-item 
                       tech_director assign_students_shows"><i class='fa fa-caret-right'></i>Assign Student</a>
                </div>
            </div>

            <div class="w3-dropdown-click">
                <button
                    type="button"
                    class="w3-button w3-dark-gray tech_director skills"
                    data-menu-toggle
                    aria-expanded="{{ 'true' if base == 'skills' else 'false' }}">
                    Tech Skills <i class="fa fa-caret-down"></i>
                </button>
                <div class="w3-dropdown-content w3-bar-block
                  {% if base == 'skills' %}w3-show{% endif %}">
                    <a href="{{ url_for('tech_director.skills') }}" 
                       class="w3-button w3-bar-item 
                       tech_director list_skills"><i class='fa fa-caret-right'></i>List</a>
                    <a href="{{ url_for('tech_director.students_skills') }}" 
                       class="w3-button w3-bar-item 
                       tech_director students_skills"><i class='fa fa-caret-right'></i>Assign Student</a>
                </div>
            </div>

            <div class="w3-dropdown-click">
                 <button
                    type="button"
                    class="w3-button w3-dark-gray tech_director inventory"
                    data-menu-toggle
                    aria-expanded="{{ 'true' if base == 'inventory' else 'false' }}">
                    Inventory <i class="fa fa-caret-down"></i>
                </button>

                <div class="w3-dropdown-content w3-bar-block
                  {% if base == 'inventory' %}w3-show{% endif %}">
                    <a href="{{ url_for('tech_director.inventory') }}"
                    class="w3-button w3-bar-item tech_director list_inventory">
                        <i class="fa fa-caret-right"></i>Inventory List
                    </a>
                    <a href="{{ url_for('tech_director.inventory_check_out') }}"
                    class="w3-button w3-bar-item tech_director inventory_check_out">
                        <i class="fa fa-caret-right"></i>Inventory Check Out
                    </a>
                </div>
            </div>

        {% if current_user.has_group("admin") %}
            <a href="{{ url_for('tech_director.upload_google_sheets') }}"
            class="w3-button w3-bar-item 
                    w3-dark-gray tech_director upload_google_sheets">Upload From Google</a>
        {% endif %}

        </div>
    </div>

</div>

<script>


function w3_open() {
  document.getElementById("tech_directorSidebar").style.display = "block";
}
function w3_close() {
  document.getElementById("tech_directorSidebar").style.display = "none";
}

document.querySelectorAll("#tech_directorSidebar [data-menu-toggle]")
  .forEach((button) => {
    button.addEventListener("click", () => {
      const submenu = button.nextElementSibling;
      const wasOpen = submenu.classList.contains("w3-show");

      // Close every menu first.
      document.querySelectorAll(
        "#tech_directorSidebar .w3-dropdown-content"
      ).forEach((menu) => {
        menu.classList.remove("w3-show");
      });

      document.querySelectorAll(
        "#tech_directorSidebar [data-menu-toggle]"
      ).forEach((toggle) => {
        toggle.setAttribute("aria-expanded", "false");
      });

      // Reopen the clicked menu unless it was already open.
      if (!wasOpen) {
        submenu.classList.add("w3-show");
        button.setAttribute("aria-expanded", "true");
      }
    });
  });

</script>
