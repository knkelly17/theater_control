{% extends "base.html" %}

{% block content %}
    <!-- h1>Enter Channel Number to set Full or Out</h1 -->

{% include 'av_club/av_club_menu.html' %}

{% if base %}
<script>
    base_page = "{{ base }}";
    document.getElementsByClassName(base_page)[0].classList.add("selected-button", "w3-green");
    document.getElementsByClassName(base_page)[0].classList.remove("w3-dark-gray");
</script>
{% endif %}

<!-- Page Content -->
<div class="w3-main" style="margin-left:200px">
  <button class="w3-button w3-xlarge w3-hide-large" onclick="w3_open()">&#9776;</button>
  <div class="w3-container">
    <h1>Manage Students</h1>
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
    <div id="student-table"></div>
    <div class="w3-row"><div class="w3-col m6 l4">&nbsp;</div></div>
    {{ form.add_student() }}
  </div>
</div>

<script>

  const requiredFields = ["name", "active"];

  const tabledata = "/av_club/get_students"

  const studentTable = new Tabulator("#student-table", {
    //height:205, // set height of table (in CSS or here), this enables the Virtual DOM and improves render speed dramatically (can
    // data:tabledata, //assign data to table
    ajaxURL: tabledata,
    layout:"fitDataTable", //fit columns to width of table (optional)
    index:"ID",
    tabEndNewRow: true,
    columns:[ //Define Table Columns
      {title:"ID", field:"ID", visible:false},
      {
        title: "Student Name", 
        field: "combined_name", // A dummy field name (doesn't need to exist in raw data)
        formatter: function(cell, formatterParams, onRendered){
          // Get the complete row data object
          var data = cell.getData(); 
          
          // Combine and return the two fields (e.g., firstName and lastName)
          return data.firstName + " " + data.lastName; 
        }
      },
      {title: "Year", 
       field: "graduationYear", 
       editor: "number", // Changed from "input"
       editorParams: {
        min: 2025,
        max: 2100,
        step: 1
       },
       mutateLink: "class", 
       validator: function(cell, value, parameters){
        // Convert string input to a base-10 integer
        var yearNum = parseInt(value, 10);
        
        // Ensure it is a valid number, and falls strictly within your min/max constraints
        return !isNaN(yearNum) && yearNum >= 2025 && yearNum <= 2100;
       }
      },
      {title:"Class", field:"class",
        mutator: function(value, data) {
          // data contains all values from the AJAX response for this row
          return getHighSchoolClass(data.graduationYear);
        }
      },
      {title:"Notes", field:"notes", editor:"input"},
      {title:"Active", field:"active", hozAlign:"center", editor:"list", 
        editorParams:{
          values:["Y", "N"],
        }
      }
    ],
    });

  studentTable.on("cellEdited", function(cell) {
    var fieldName = cell.getField();

    // 1. Block the calculated column from triggering the update
    if (fieldName === "class") { 
        return; // Exit early, doing nothing
    }
    const row = cell.getRow();
    const rowID = row.getIndex()
    if (rowID) {
      editCell(cell, "students", "/dm7/update_db_field"); 
    } else {
      addRow(cell, "students", requiredFields, "/dm7/insert_db_row")
    }     
  });


//Add row on "Add Row" button click
document.getElementById("add_student").addEventListener("click", function(){
    studentTable.addRow({});
});
</script>

<script src="{{ url_for('dm7.static', filename='js/dm7.js') }}?v={{ version }}"></script>



{% endblock %}
